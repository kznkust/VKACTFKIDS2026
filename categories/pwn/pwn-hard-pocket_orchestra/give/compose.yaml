services:
  challenge:
    build: .
    platform: linux/amd64
    ports:
      - "${PORT:-31342}:31337"
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 192m
    cpus: 1.0
    ulimits:
      core: 0
      nofile:
        soft: 256
        hard: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
